    <main id="mainContato">
        <form>
            <h1>Formulário de Contato</h1>
            <label for="nomeContato">Nome Completo</label>
            <input id="nomeContato" type="text" required>
            <label for="emailContato">E-mail</label>
            <input id="emailContato" type="email" required>
            <label for="cpfContato">CPF</label>
            <input id="cpfContato" type="number" required>
            <label for="dataContato">Data de Nascimento</label>
            <input id="dataContato" type="date" required>
            <label for="telefoneContato">Telefone</label>
            <input id="telefoneContato" type="tel">
            <label for="senhaContato">Senha</label>
            <input id="senhaContato" type="password">
            <label for="confSenhaContato">Confirmação da Senha</label>
            <input id="confSenhaContato" type="password">
            <div id="divisaoGeneroForm">
                <h1>Gênero</h1>
                <label for="masculino">Masculino</label>
                <input id="masculino" type="radio" name="genero">
                <label for="feminino">Feminino</label>
                <input id="feminino" type="radio" name="genero">
            </div>
            <div id="divInteresses">
                <h1>Interesses</h1>
                <label>x</label>
                <input type="checkbox">
                <label>y</label>
                <input type="checkbox">
                <label>z</label>
                <input type="checkbox">
            </div>

            <h1>Como Conheceu o Site</h1>
            <select>
                <option>Pesquisa no Google (ou outros buscadores)</option>
                <option>Redes Sociais (Instagram, TikTok, Facebook, LinkedIn)</option>
                <option>Indicação de amigos ou familiares (Boca a boca)</option>
                <option>Anúncios na internet (Propagandas em sites ou apps)</option>
                <option>Outros</option>
            </select>
            <div id="divAceiteTermos">
                <label for="aceiteTermos">Aceite os Termos</label>
                <input id="aceiteTermos" type="checkbox" required>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
